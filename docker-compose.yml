services:
  postgres:
    image: postgres:16
    container_name: linux-learning-postgres
    environment:
      POSTGRES_DB: linux_learning
      POSTGRES_USER: linux_learning
      POSTGRES_PASSWORD: linux_learning
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: linux-learning-redis
    ports:
      - "6379:6379"

volumes:
  postgres-data:
